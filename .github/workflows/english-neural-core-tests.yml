name: English neural core tests

on:
  push:
    branches: [main]
    paths:
      - "scripts/english-neural-core.mjs"
      - "tests/english-neural-core.test.mjs"
      - ".github/workflows/english-neural-core-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Syntax check
        run: node --check scripts/english-neural-core.mjs
      - name: Unit tests
        run: node --test tests/english-neural-core.test.mjs
