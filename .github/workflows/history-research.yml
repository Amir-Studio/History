name: History research intake

on:
  workflow_dispatch:
    inputs:
      max_candidates:
        description: "Maximum news candidates to investigate (1-5)"
        required: false
        default: "3"
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: history-research-intake
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout archive
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate JavaScript syntax
        run: node --check scripts/research-agent.mjs
      - name: Run research agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          HISTORY_MODEL: gpt-6-astra
          MAX_CANDIDATES: ${{ inputs.max_candidates || '3' }}
        run: node scripts/research-agent.mjs
      - name: Evaluate reviewed quality benchmark
        run: node scripts/evaluate-quality.mjs
      - name: Validate JSON and diff
        run: |
          node --input-type=module -e "import fs from 'node:fs'; for (const f of fs.readdirSync('data/news').filter(x => x.endsWith('.json'))) JSON.parse(fs.readFileSync('data/news/'+f,'utf8')); JSON.parse(fs.readFileSync('data/news/index.json','utf8'));"
          git diff --check
      - name: Open human review pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "No new archive proposals."
            exit 0
          fi
          BRANCH="history-news-review-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add data/news feed.xml sitemap.xml data/quality/evaluation.json
          git commit -m "Propose researched historical news records"
          git push --set-upstream origin "$BRANCH"
          gh pr create --base main --head "$BRANCH" --title "History: news research proposals" --body "Automated research proposals only. All records remain pending_review. Please inspect source independence, primary documents, disagreements, and every claim before merging. No proposal is marked verified."
