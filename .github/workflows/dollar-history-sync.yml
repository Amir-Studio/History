name: Dollar no-key archive intake

on:
  push:
    branches: [main]
    paths:
      - scripts/dollar-sync.mjs
      - .github/workflows/dollar-history-sync.yml
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dollar-history-intake
  cancel-in-progress: false

jobs:
  intake:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out History
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: true
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run no-key Dollar intake
        run: |
          node --check scripts/dollar-sync.mjs
          node scripts/dollar-sync.mjs
      - name: Commit pending-review candidates without publishing them
        run: |
          if [ -z "$(git status --porcelain -- data/pending-review)" ]; then
            echo "No new pending-review candidates."
            exit 0
          fi
          git add data/pending-review
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Archive pending-review Dollar news and prices"
          git push origin HEAD:main
